<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>캄보디아 선교 답사</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌴</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+Khmer:wght@400;600&display=swap">
<style>
:root{
  --leaf:#1E4A38; --leaf-2:#2F6B52; --sugar:#C08A2B; --sugar-soft:#F6ECD9; --sugar-ink:#7A5516;
  --ink:#1D2420; --muted:#66706B; --line:#E2E6E3; --wash:#EEF1EE; --paper:#FFFFFF; --warn:#B3412E;
  --serif:'Gowun Batang','Noto Serif KR',serif;
  --sans:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--wash);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all}
.book{max-width:640px;margin:0 auto;background:var(--paper);min-height:100vh}

/* 표지 */
.cover{background:var(--leaf);color:#fff;padding:32px 22px 22px}
.cover p{margin:0;font-size:14px;opacity:.82}
.cover h1{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.3;margin:6px 0 18px}
.dday{display:flex;align-items:baseline;gap:10px;border-top:1px solid rgba(255,255,255,.22);padding-top:16px}
.dday b{font-family:var(--serif);font-size:46px;line-height:1;color:#F2D49B;font-weight:700}
.dday span{font-size:15px;opacity:.92}

/* 메뉴 */
nav.tabs{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:14px 14px 11px;font:inherit;font-size:15px;color:var(--muted);white-space:nowrap;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--leaf);font-weight:700;border-bottom-color:var(--sugar)}
nav.tabs button:focus-visible,button:focus-visible{outline:2px solid var(--sugar);outline-offset:-2px}

main{padding:26px 20px 40px;min-height:60vh}
h2.chapter{font-family:var(--serif);font-size:26px;line-height:1.35;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 26px;font-size:15px}
.notice{background:var(--sugar-soft);color:var(--sugar-ink);font-size:14px;padding:10px 14px;border-radius:8px;margin:0 0 22px}

/* 일정 */
.day{margin-bottom:30px}
.day h3{font-size:17px;margin:0 0 12px;color:var(--leaf);display:flex;align-items:center;gap:8px}
.day.today h3::after{content:"오늘";font-size:12px;font-weight:600;background:var(--sugar);color:#fff;padding:1px 8px;border-radius:10px}
.timeline{list-style:none;margin:0 0 0 6px;padding:0 0 0 18px;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 18px 4px}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{content:"";position:absolute;left:-25px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--paper);border:2px solid var(--leaf-2)}
.t-time{font-size:13px;font-weight:600;color:var(--sugar-ink)}
.t-title{font-weight:600}
.t-desc{color:var(--muted);font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:500;padding:0 8px;border-radius:10px;background:var(--sugar-soft);color:var(--sugar-ink);margin-left:6px;vertical-align:1px}
.tag.off{background:var(--wash);color:var(--muted);text-decoration:line-through}
.team-sec{margin-top:40px;padding-top:26px;border-top:2px solid var(--line)}
.team-sec > h3{font-family:var(--serif);font-size:21px;margin:0 0 6px;color:var(--leaf)}
.team-sec > p.t-desc{margin:0 0 22px}

/* 예산 */
.totals{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:28px}
.totals div{background:var(--paper);padding:14px 16px}
.totals small{display:block;color:var(--muted);font-size:13px}
.totals strong{font-size:19px;font-variant-numeric:tabular-nums}
.totals .hi{background:var(--sugar-soft)}
.totals .hi strong{color:var(--sugar-ink);font-size:24px}
.totals .wide{grid-column:1 / -1}
.per-note{margin:-16px 0 18px;font-size:13px}
.cat .row.sub .num{font-size:13px;color:var(--sugar-ink)}
.cat{padding:13px 0;border-bottom:1px solid var(--line)}
.cat .row{display:flex;justify-content:space-between;gap:12px}
.cat .num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px;text-align:right}
.cat .num b{color:var(--ink);font-weight:600}
.bar{height:6px;background:var(--wash);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf-2);border-radius:3px}
.bar i.over{background:var(--warn)}

/* 참가자 */
.ready{font-size:15px;margin:0 0 18px}
.ready b{color:var(--leaf)}
.person{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.person .who b{display:block;font-size:17px}
.person .who span{color:var(--muted);font-size:14px}
.checks{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:62%}
.check{font-size:12px;padding:2px 9px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.check.done{background:var(--leaf);border-color:var(--leaf);color:#fff}

/* 선교지 */
.m-photo{margin:0 0 26px}
.m-photo img{display:block;width:100%;height:auto;border-radius:10px;background:var(--wash)}
.facts{margin:0 0 30px}
.facts div{display:grid;grid-template-columns:5.5em 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted);font-size:14px;padding-top:2px}
.facts dd{margin:0}
.m-sec{margin:0 0 28px}
.m-sec h3{font-family:var(--serif);font-size:20px;margin:0 0 10px;color:var(--leaf)}
.m-sec blockquote{margin:0;padding:14px 16px;background:var(--sugar-soft);border-radius:8px;font-family:var(--serif);font-size:17px;line-height:1.8}
.prayer{list-style:none;margin:0;padding:0}
.prayer li{padding:10px 0;border-bottom:1px solid var(--line)}
.prayer b{display:block}
.prayer span{color:var(--muted);font-size:15px}


/* 알고 가기 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px}
.chips button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--leaf);border-radius:18px;padding:6px 14px;cursor:pointer}
.l-sec{margin:0 0 36px;scroll-margin-top:60px}
.l-sec h3{font-family:var(--serif);font-size:21px;margin:0 0 6px;color:var(--leaf)}
.l-sec > p.t-desc{margin:0 0 16px}
.years{list-style:none;margin:0;padding:0}
.years li{display:grid;grid-template-columns:5.4em 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.years .y{font-weight:700;color:var(--sugar-ink);font-variant-numeric:tabular-nums;font-size:15px}
.years b{display:block}
.years p{margin:2px 0 0;color:var(--muted);font-size:15px}
.more{display:inline-block;margin-top:4px;font-size:13px;color:var(--leaf-2);text-decoration:none;border-bottom:1px solid var(--line)}
.more + .more{margin-left:10px}
.phrases{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phrase{border:1px solid var(--line);border-radius:10px;padding:12px 13px}
.phrase small{display:block;color:var(--muted);font-size:13px}
.phrase b{display:block;font-size:18px;color:var(--leaf);margin:2px 0}
.phrase .km{font-family:'Noto Sans Khmer',sans-serif;font-size:15px;color:var(--ink)}
.phrase .note{display:block;font-size:12px;color:var(--sugar-ink);margin-top:2px}
.phrase.wide{grid-column:1 / -1}
.tips{list-style:none;margin:0;padding:0}
.tips li{padding:11px 0;border-bottom:1px solid var(--line)}
.tips b{display:block}
.tips span{color:var(--muted);font-size:15px}
.tips.entry li{padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--sugar);border-radius:8px;margin-bottom:10px;background:var(--paper)}
.tips.entry li:first-child{background:var(--sugar-soft)}
.btable{width:100%;border-collapse:collapse;margin:0 0 18px;font-size:15px}
.btable th,.btable td{border-bottom:1px solid var(--line);padding:9px 4px;text-align:left;vertical-align:top}
.btable th{background:var(--wash);font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.btable td b{display:block;font-weight:600}
.btable td small{display:block;color:var(--muted);font-size:12px}
.btable .n{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.btable tr.hi td{background:var(--sugar-soft)}
.btable tr.hi .n{color:var(--sugar-ink);font-weight:700}
/* 보고 */
article.report{padding:0 0 30px;margin:0 0 30px;border-bottom:1px solid var(--line)}
article.report time{font-size:13px;color:var(--sugar-ink);font-weight:600}
article.report h3{font-family:var(--serif);font-size:22px;line-height:1.4;margin:4px 0 12px}
article.report img{display:block;width:100%;height:auto;border-radius:8px;margin:0 0 12px;background:var(--wash)}
article.report p{margin:0 0 8px}
article.report .by{color:var(--muted);font-size:14px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

footer{padding:18px 20px 36px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:12px}
footer button{font:inherit;font-size:13px;color:var(--leaf);background:none;border:1px solid var(--line);border-radius:16px;padding:5px 12px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){ main{animation:in .25s ease-out} @keyframes in{from{opacity:.4}to{opacity:1}} }
</style>
</head>
<body>
<div class="book">
  <header class="cover" id="cover">
    <p id="dates">&nbsp;</p>
    <h1 id="title">캄보디아 선교 답사</h1>
    <div class="dday" id="dday"></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="메뉴"></nav>
  <main id="main" role="tabpanel"><p class="lead">내용을 불러오는 중입니다.</p></main>
  <footer><span id="status"></span><button type="button" id="refresh">새로고침</button></footer>
</div>

<script>
/* Apps Script 웹 앱 URL — 비어 있으면 예시 화면이 보입니다 */
const API_URL = 'https://script.google.com/macros/s/AKfycbwEZ3L6UZprx8Zhl7pA7ypp6s0Txho9648msmZrCkn3fnCo-eZOmWQik1-fHJ7CYVziXQ/exec';

const TABS = [['schedule','일정'],['budget','예산'],['people','참가자'],['mission','선교지'],['learn','알고 가기'],['reports','탐방 보고']];
const STORE = 'cambodia-webbook-v1';
const WEEK = ['일','월','화','수','목','금','토'];
let DATA = null, DEMO = false;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const br = s => esc(s).replace(/\n/g, '<br>');
const won = n => Math.round(Number(n) || 0).toLocaleString('ko-KR') + '원';
function toDate(s){ const m = String(s||'').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); return m ? new Date(+m[1], m[2]-1, +m[3]) : null; }
function dayLabel(s){ const d = toDate(s); return d ? `${d.getMonth()+1}월 ${d.getDate()}일 (${WEEK[d.getDay()]})` : esc(s); }
function sameDay(a,b){ return a && b && a.toDateString() === b.toDateString(); }

/* ---------- 표지 ---------- */
function renderCover(){
  const t = DATA.trip || {};
  $('#title').textContent = t.title || '캄보디아 선교 답사';
  const dep = toDate(t.depart), ret = toDate(t.ret);
  $('#dates').textContent = dep ? `${dep.getFullYear()}년 ${dayLabel(t.depart)} – ${ret ? dayLabel(t.ret) : ''}` : '';
  const today = new Date(); today.setHours(0,0,0,0);
  let html = '';
  if (dep) {
    const diff = Math.round((dep - today) / 864e5);
    if (diff > 0) html = `<span>출발까지</span><b>${diff}일</b>`;
    else if (ret && today <= ret) html = `<span>답사</span><b>${1 - diff}일째</b>`;
    else html = `<span>답사를 마쳤습니다. 함께해 주셔서 감사합니다.</span>`;
  }
  $('#dday').innerHTML = html;
}

/* ---------- 메뉴 ---------- */
function current(){ const h = location.hash.slice(1); return TABS.some(t => t[0] === h) ? h : 'schedule'; }
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(([id, name]) =>
    `<button type="button" role="tab" data-id="${id}" aria-selected="false">${name}</button>`).join('');
  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (location.hash.slice(1) !== b.dataset.id) location.hash = b.dataset.id; else render();
  });
}

/* ---------- 화면들 ---------- */
const VIEWS = {
  schedule(d){
    // 웹_일정에서 '일정' 칸이 [태국팀]으로 시작하는 줄은 아래 '태국팀 일정'으로 따로 모음
    const TH = '[태국팀]';
    const all = d.schedule || [];
    const main = all.filter(s => !String(s.title || '').startsWith(TH));
    const team = all.filter(s => String(s.title || '').startsWith(TH))
      .map(s => Object.assign({}, s, { title: String(s.title).slice(TH.length).trim() }));
    const today = new Date();
    const group = rows => {
      const days = [];
      rows.forEach(s => {
        let g = days.find(x => x.date === s.date);
        if (!g) days.push(g = { date: s.date, items: [] });
        g.items.push(s);
      });
      return days.map(g => `<section class="day${sameDay(toDate(g.date), today) ? ' today' : ''}">
        <h3>${dayLabel(g.date)}</h3>
        <ol class="timeline">${g.items.map(s => `<li>
          <div class="t-time">${esc(s.time)}</div>
          <div class="t-title">${esc(s.title)}${s.status && s.status !== '확정' ? `<span class="tag${s.status === '취소' ? ' off' : ''}">${esc(s.status)}</span>` : ''}</div>
          ${s.desc ? `<div class="t-desc">${br(s.desc)}</div>` : ''}
        </li>`).join('')}</ol></section>`).join('');
    };
    if (!main.length && !team.length) return head('일정', '일정이 정해지면 이곳에 올라옵니다.');
    return head('일정', '현지 사정에 따라 바뀔 수 있습니다. 바뀌면 이 화면에 바로 반영됩니다.') + group(main) +
      (team.length ? `<section class="team-sec" id="team">
        <h3>태국팀 일정</h3>
        <p class="t-desc">태국팀은 본진을 배웅한 뒤 캄보디아에 더 머물고, 태국을 거쳐 1월 29일에 귀국합니다. 1월 18일 출국편은 본진과 같습니다.</p>
        ${group(team)}</section>` : '');
  },

  budget(d){
    const b = d.budget || {};
    const n = Number(b.people) || 0;
    const per = v => n ? Math.round((Number(v) || 0) / n) : 0;
    const AIR = '항공권';
    const all = b.categories || [];
    const air = all.find(c => c.name === AIR);
    const fee = (b.totalPlan || 0) - (air ? air.plan : 0);
    const left = fee - (b.totalUsed || 0);
    const usedPer = b.perPerson || per(b.totalUsed);
    const cats = all.filter(c => c.name !== AIR).map(c => {
      const pct = c.plan ? Math.min(c.used / c.plan, 1) * 100 : 0;
      return `<div class="cat"><div class="row"><span>${esc(c.name)}</span>
        <span class="num"><b>${won(c.used)}</b>${c.plan ? ` / ${won(c.plan)}` : ''}</span></div>
        ${c.plan && n ? `<div class="row sub"><span></span><span class="num">1인 ${won(per(c.plan))}</span></div>` : ''}
        ${c.plan ? `<div class="bar"><i class="${c.used > c.plan ? 'over' : ''}" style="width:${pct}%"></i></div>` : ''}
        ${c.memo ? `<div class="t-desc">${esc(c.memo)}</div>` : ''}</div>`;
    }).join('');
    const airRow = air ? `<div class="cat"><div class="row"><span>${esc(air.name)}<span class="tag">각자 결제</span></span>
        <span class="num"><b>${won(air.plan)}</b></span></div>
        ${n ? `<div class="row sub"><span></span><span class="num">1인 ${won(per(air.plan))}</span></div>` : ''}
        ${air.memo ? `<div class="t-desc">${esc(air.memo)}</div>` : ''}</div>` : '';
    return head('예산', '모든 비용은 개인 부담입니다. 현지 비용은 회비로 미리 걷어 함께 쓰고, 답사 후 정산해 남으면 돌려드리고 모자라면 더 걷습니다. 항공권은 각자 결제합니다.') +
      `<div class="totals">
        <div class="hi wide"><small>1인 회비 · 미리 걷는 금액${n ? ` (${n}명)` : ''}</small><strong>${won(per(fee))}</strong></div>
        <div><small>1인 총 부담액 (항공 포함)</small><strong>${won(per(b.totalPlan))}</strong></div>
        <div><small>회비 총액</small><strong>${won(fee)}</strong></div>
        <div><small>사용한 회비</small><strong>${won(b.totalUsed)}</strong></div>
        <div><small>1인당 사용</small><strong>${won(usedPer)}</strong></div>
        <div class="wide"><small>남은 회비</small><strong>${won(left)}</strong></div>
      </div>
      ${n ? `<p class="t-desc per-note">회비는 현지 비용을 ${n}명이 똑같이 나눈 금액이고, 총 부담액은 여기에 항공권을 더한 금액입니다. 인원이 바뀌면 자동으로 다시 계산됩니다.</p>` : ''}${cats}${airRow}`;
  },

  people(d){
    const ps = d.people || [];
    if (!ps.length) return head('참가자', '참가자 명단이 정해지면 이곳에 올라옵니다.');
    const keys = Object.keys(ps[0].checks || {});
    const ready = ps.filter(p => keys.every(k => p.checks[k])).length;
    return head('참가자', '출발 준비 상황입니다. 빠진 항목이 있으면 담당자에게 알려 주세요.') +
      `<p class="ready">준비를 모두 마친 분 <b>${ready}명</b> / ${ps.length}명</p>` +
      ps.map(p => `<div class="person"><div class="who"><b>${esc(p.name)}</b>${p.role ? `<span>${esc(p.role)}</span>` : ''}</div>
        <div class="checks">${keys.map(k => `<span class="check${p.checks[k] ? ' done' : ''}">${p.checks[k] ? '✓ ' : ''}${esc(k)}</span>`).join('')}</div></div>`).join('');
  },

  mission(d){
    const all = d.mission || [];
    if (!all.length) return head('선교지', '선교지 소개를 준비하고 있습니다.');
    const photos = all.filter(r => r.k === '사진').map(r => String(r.v || '').trim()).filter(v => photoUrl(v));
    const rows = all.filter(r => r.k !== '사진');
    const facts = [], secs = []; let cur = null;
    rows.forEach(r => {
      if (String(r.k).startsWith('◆')) { cur = { title: r.k.replace(/^◆\s*/, ''), text: r.v, items: [] }; secs.push(cur); }
      else if (cur) cur.items.push(r);
      else if (r.k !== '항목') facts.push(r);
    });
    return head('선교지', '우리가 방문할 선교사님과 사역 현장입니다.') +
      photos.map(src => `<figure class="m-photo">${imgTag(src, '이희철 · 문샛별 선교사 가정')}</figure>`).join('') +

/* 드라이브 공유 링크 → 이미지 주소 (사진은 '링크가 있는 모든 사용자' 공유 필요) */
function driveId(u){
  u = String(u || '');
  const m = u.match(/[-\w]{25,}/);
  return (u.includes('drive.google.com') || u.includes('googleusercontent.com')) && m ? m[0] : '';
}
function photoUrl(u){
  u = String(u || '').trim();
  const id = driveId(u);
  if (id) return `https://lh3.googleusercontent.com/d/${id}=w1200`;
  return /^https?:\/\//.test(u) ? u : '';
}
// 구글 이미지 주소가 브라우저·로그인 상태에 따라 막힐 때 다른 주소로 차례로 다시 시도
function imgFallback(el){
  const id = el.dataset.id; if (!id) return;
  const alts = [`https://drive.google.com/thumbnail?id=${id}&sz=w1200`, `https://drive.google.com/uc?export=view&id=${id}`];
  const n = +(el.dataset.try || 0);
  if (n < alts.length) { el.dataset.try = n + 1; el.src = alts[n]; }
  else { const f = el.closest('figure'); if (f) f.style.display = 'none'; }
}
function imgTag(src, alt){
  const id = driveId(src);
  return `<img src="${esc(photoUrl(src) || src)}" alt="${esc(alt)}" loading="lazy" referrerpolicy="no-referrer"${id ? ` data-id="${id}" onerror="imgFallback(this)"` : ''}>`;
}

function head(title, lead){
  return (DEMO ? `<p class="notice">예시 화면입니다. 구글시트와 연결하면 실제 내용이 보입니다.</p>` : '') +
    `<h2 class="chapter">${title}</h2>${lead ? `<p class="lead">${lead}</p>` : ''}`;
}

function render(){
  const id = current();
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.id === id));
  if (!DATA) return;
  renderCover();
  $('#main').innerHTML = VIEWS[id](DATA);
  const coverH = $('#cover').offsetHeight;
  if (window.scrollY > coverH) window.scrollTo(0, coverH);
  const active = document.querySelector('#tabs button[aria-selected="true"]');
  if (active) active.scrollIntoView({ block: 'nearest', inline: 'center' });
}
window.addEventListener('hashchange', render);
$('#main').addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  const el = document.getElementById(b.dataset.go); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

/* ---------- 불러오기 (오프라인이면 마지막 저장본) ---------- */
async function load(force){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE)); } catch (e) {}
  if (!API_URL) { DATA = DEMO_DATA; DEMO = true; render(); $('#status').textContent = '예시 데이터'; return; }
  if (saved && !DATA) { DATA = saved; render(); }
  $('#status').textContent = '불러오는 중…';
  try {
    const res = await fetch(API_URL + (force ? '?nocache=1' : ''));
    if (!res.ok) throw new Error(res.status);
    DATA = await res.json();
    try { localStorage.setItem(STORE, JSON.stringify(DATA)); } catch (e) {}
    render();
    $('#status').textContent = `최근 업데이트 ${DATA.updated}`;
  } catch (e) {
    $('#status').textContent = saved
      ? `인터넷 연결이 없어 저장된 내용(${saved.updated})을 보여 줍니다.`
      : '내용을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침을 눌러 주세요.';
  }
}
$('#refresh').addEventListener('click', () => load(true));
